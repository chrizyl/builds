<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <title>The SEVENTEEN Archive | Member Profiles</title>
    <link rel="icon" type="image/png" href="assets/images/svtlogo.png" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
        rel="stylesheet" />
    <link href="assets/style.css" rel="stylesheet" />
</head>

<body>
    <main class="container py-4 py-lg-5">
        <p id="crumb" class="crumb mb-4">SEVENTEEN <span aria-hidden="true">/</span> THE MEMBER ARCHIVE</p>
        <div id="status" class="archive-status" role="status" aria-live="polite">Loading the archive...</div>

        <section id="homeView" aria-labelledby="homeTitle">
            <div class="row align-items-end g-3 mb-2">
                <div class="col-12 col-lg-8">
                    <h1 id="homeTitle" class="big-title home-title">The SEVENTEEN <em>archive</em>
                    </h1>
                    <p class="site-lead mb-0">Thirteen members, three units, and the stories behind every name. Open a file to explore each profile.</p>
                </div>
            </div>
            <div id="unitFilter" class="d-flex flex-wrap gap-2 mt-3" role="group" aria-label="Filter members by unit">
            </div>
            <div class="row">
                <div class="col-12">
                    <div id="folderStack" class="folder-stack" role="group" aria-label="Member folders"></div>
                </div>
            </div>
        </section>

        <section id="detailView" class="detail-wrap" aria-labelledby="detailTitle" hidden>
            <div class="d-flex align-items-center gap-3">
                <button type="button" id="backBtn" class="back-btn" aria-label="Back to all members">
                    <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M13 8H3m5-5L3 8l5 5" />
                    </svg>
                </button>
                <span class="key-hint d-none d-md-inline">Browse with ← and → <span aria-hidden="true">·</span> Return with Esc</span>
            </div>
            <h2 id="detailTitle" class="big-title" tabindex="-1"></h2>
            <div id="idCard" aria-live="polite"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="assets/main.js"></script>
</body>

</html>
